[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "barepixel"
version = "0.2.0"
description = "A small image processing library made with Python and NumPy."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy>=1.26", "opencv-python-headless>=4.8"]

[project.optional-dependencies]
dev = ["pytest>=8", "scipy>=1.11", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
